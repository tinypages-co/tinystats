# Builds the TinyPages Umami image on a native amd64 runner and pushes it to GHCR, tagged with the
# commit sha (the version Kamal deploys). Deploy from the Mac: `kamal deploy -d <destination> --skip-push`.
# A Mac build runs under amd64 emulation and the Next.js (Turbopack) build dies silently there.
name: TinyPages image

on:
  push:
    branches: [preview, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/tinypages-co/tinypages-umami:${{ github.sha }}
          # Kamal checks this label before running the image.
          labels: service=umami
          cache-from: type=registry,ref=ghcr.io/tinypages-co/tinypages-umami:buildcache
          cache-to: type=registry,ref=ghcr.io/tinypages-co/tinypages-umami:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
